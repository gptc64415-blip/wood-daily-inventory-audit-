<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wood Daily Inventory Audit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .content {
            padding: 30px;
        }
        .form-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        .form-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-row.full {
            grid-template-columns: 1fr;
        }
        .inventory-item {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 10px;
            align-items: center;
        }
        .inventory-item input {
            margin: 0;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 1em;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #764ba2;
            color: white;
        }
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.4);
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
            padding: 8px 12px;
            font-size: 0.9em;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-add {
            background: #27ae60;
            color: white;
            margin-top: 10px;
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(39, 174, 96, 0.4);
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .date-time {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .total-section {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            border-left: 4px solid #27ae60;
        }
        .total-section h3 {
            color: #27ae60;
            margin-bottom: 10px;
        }
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .inventory-item {
                grid-template-columns: 1fr;
            }
            .button-group {
                flex-direction: column;
            }
            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌳 Wood Daily Inventory Audit</h1>
            <p>Track and manage your wood inventory with daily audits</p>
        </div>
        
        <div class="content">
            <div class="success-message" id="successMessage">
                ✅ Inventory audit saved successfully!
            </div>

            <form id="auditForm">
                <!-- Audit Info Section -->
                <div class="form-section">
                    <h2>📋 Audit Information</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="auditDate">Audit Date:</label>
                            <input type="date" id="auditDate" required>
                        </div>
                        <div class="form-group">
                            <label for="auditTime">Audit Time:</label>
                            <input type="time" id="auditTime" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="auditorName">Auditor Name:</label>
                            <input type="text" id="auditorName" placeholder="Enter your name" required>
                        </div>
                        <div class="form-group">
                            <label for="location">Location/Warehouse:</label>
                            <input type="text" id="location" placeholder="e.g., Main Warehouse" required>
                        </div>
                    </div>
                </div>

                <!-- Inventory Items Section -->
                <div class="form-section">
                    <h2>📦 Inventory Items</h2>
                    <div id="itemsContainer"></div>
                    <button type="button" class="btn btn-add" onclick="addInventoryItem()">+ Add Item</button>
                </div>

                <!-- Summary Section -->
                <div class="form-section">
                    <h2>📊 Summary</h2>
                    <div class="total-section">
                        <h3>Total Quantity: <span id="totalQty">0</span> units</h3>
                        <h3>Total Value: $<span id="totalValue">0.00</span></h3>
                    </div>
                    <div class="form-group form-row full" style="margin-top: 15px;">
                        <label for="notes">Additional Notes:</label>
                        <textarea id="notes" rows="4" placeholder="Any additional comments or observations..."></textarea>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">💾 Save Audit</button>
                    <button type="button" class="btn btn-secondary" onclick="exportData()">📥 Export as JSON</button>
                    <button type="reset" class="btn btn-danger" onclick="clearForm()">🔄 Clear Form</button>
                </div>
            </form>

            <!-- Previous Audits -->
            <div class="form-section" style="margin-top: 30px;">
                <h2>📅 Recent Audits</h2>
                <div id="auditHistory" style="color: #666; font-size: 0.95em;">
                    <p>No audits saved yet. Complete an audit to see history here.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set today's date and current time
        document.getElementById('auditDate').valueAsDate = new Date();
        document.getElementById('auditTime').value = new Date().toTimeString().slice(0, 5);

        // Add initial item
        addInventoryItem();

        function addInventoryItem() {
            const container = document.getElementById('itemsContainer');
            const itemCount = container.children.length + 1;
            const itemHtml = `
                <div class="inventory-item" data-item="${itemCount}">
                    <input type="text" placeholder="Wood Type/Description" class="item-name" value="">
                    <input type="number" placeholder="Quantity" class="item-qty" value="0" min="0" oninput="calculateTotals()">
                    <input type="text" placeholder="Unit" class="item-unit" value="pcs">
                    <input type="number" placeholder="Price/Unit" class="item-price" value="0" min="0" step="0.01" oninput="calculateTotals()">
                    <button type="button" class="btn btn-danger" onclick="removeInventoryItem(this)">✕</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', itemHtml);
        }

        function removeInventoryItem(btn) {
            btn.parentElement.remove();
            calculateTotals();
        }

        function calculateTotals() {
            let totalQty = 0;
            let totalValue = 0;
            
            document.querySelectorAll('.inventory-item').forEach(item => {
                const qty = parseFloat(item.querySelector('.item-qty').value) || 0;
                const price = parseFloat(item.querySelector('.item-price').value) || 0;
                totalQty += qty;
                totalValue += (qty * price);
            });

            document.getElementById('totalQty').textContent = totalQty.toFixed(0);
            document.getElementById('totalValue').textContent = totalValue.toFixed(2);
        }

        function clearForm() {
            if (confirm('Are you sure you want to clear the form?')) {
                document.getElementById('auditForm').reset();
                document.getElementById('itemsContainer').innerHTML = '';
                addInventoryItem();
                document.getElementById('auditDate').valueAsDate = new Date();
                document.getElementById('auditTime').value = new Date().toTimeString().slice(0, 5);
            }
        }

        function exportData() {
            const auditData = {
                date: document.getElementById('auditDate').value,
                time: document.getElementById('auditTime').value,
                auditor: document.getElementById('auditorName').value,
                location: document.getElementById('location').value,
                items: [],
                notes: document.getElementById('notes').value,
                totals: {
                    quantity: document.getElementById('totalQty').textContent,
                    value: document.getElementById('totalValue').textContent
                }
            };

            document.querySelectorAll('.inventory-item').forEach(item => {
                auditData.items.push({
                    name: item.querySelector('.item-name').value,
                    quantity: item.querySelector('.item-qty').value,
                    unit: item.querySelector('.item-unit').value,
                    price: item.querySelector('.item-price').value
                });
            });

            const dataStr = JSON.stringify(auditData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `inventory_audit_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
        }

        document.getElementById('auditForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Save to localStorage
            const auditData = {
                date: document.getElementById('auditDate').value,
                time: document.getElementById('auditTime').value,
                auditor: document.getElementById('auditorName').value,
                location: document.getElementById('location').value,
                timestamp: new Date().toISOString()
            };

            let audits = JSON.parse(localStorage.getItem('audits')) || [];
            audits.push(auditData);
            localStorage.setItem('audits', JSON.stringify(audits));

            // Show success message
            const msgDiv = document.getElementById('successMessage');
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 3000);

            updateAuditHistory();
        });

        function updateAuditHistory() {
            const audits = JSON.parse(localStorage.getItem('audits')) || [];
            const historyDiv = document.getElementById('auditHistory');
            
            if (audits.length === 0) {
                historyDiv.innerHTML = '<p>No audits saved yet. Complete an audit to see history here.</p>';
                return;
            }

            let html = '<ul style="list-style: none;">';
            audits.slice(-5).reverse().forEach(audit => {
                html += `<li style="padding: 8px; border-bottom: 1px solid #eee;">
                    📅 ${audit.date} at ${audit.time} - ${audit.location} (Auditor: ${audit.auditor})
                </li>`;
            });
            html += '</ul>';
            historyDiv.innerHTML = html;
        }

        // Load history on page load
        updateAuditHistory();
        calculateTotals();
    </script>
</body>
</html>
